<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0fdf4" />
    <title>Chronos | Gestão Acadêmica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      .startup-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 15% 15%, rgb(134 239 172 / 72%), transparent 36%),
          radial-gradient(ellipse at 85% 20%, rgb(103 232 249 / 58%), transparent 34%),
          radial-gradient(ellipse at 75% 90%, rgb(196 181 253 / 42%), transparent 38%),
          linear-gradient(145deg, #f0fdf4 0%, #eff6ff 52%, #ecfeff 100%);
        color: #14532d;
        font-family: Inter, system-ui, sans-serif;
      }

      .startup-splash {
        display: grid;
        width: min(90vw, 28rem);
        min-height: 24rem;
        justify-items: center;
        align-content: center;
        gap: 1.75rem;
        padding: clamp(2rem, 7vw, 3.5rem) clamp(1.5rem, 6vw, 3rem);
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 2rem;
        background: rgb(255 255 255 / 84%);
        box-shadow:
          0 32px 80px rgb(15 23 42 / 12%),
          0 8px 24px rgb(22 101 52 / 8%);
        backdrop-filter: blur(16px);
        text-align: center;
        animation: splash-arrive 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .startup-mark {
        position: relative;
        display: grid;
        width: 6rem;
        height: 6rem;
        place-items: center;
        border: 1px solid rgb(22 101 52 / 12%);
        border-radius: 2rem;
        background: linear-gradient(145deg, #fff, #f0fdf4);
        box-shadow:
          0 18px 44px rgb(22 101 52 / 14%),
          inset 0 1px 0 rgb(255 255 255 / 90%);
      }

      .startup-mark::before,
      .startup-mark::after {
        position: absolute;
        width: 4.5rem;
        height: 4.5rem;
        border: 3px solid transparent;
        border-top-color: #15803d;
        border-radius: 50%;
        content: "";
        animation: startup-spin 1.8s linear infinite;
      }

      .startup-mark::after {
        width: 3.65rem;
        height: 3.65rem;
        border-top-color: #86efac;
        animation-direction: reverse;
      }

      .startup-mark span {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .startup-copy {
        display: grid;
        gap: 0.55rem;
        text-align: center;
      }

      .startup-copy strong {
        color: #14532d;
        font-size: clamp(1.5rem, 6vw, 1.85rem);
        font-weight: 750;
        letter-spacing: -0.045em;
      }

      .startup-copy span {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .startup-progress {
        width: min(100%, 15rem);
        height: 0.4rem;
        overflow: hidden;
        border-radius: 999px;
        background: #dcfce7;
      }

      .startup-progress::after {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #16a34a, #4ade80);
        box-shadow: 0 0 18px rgb(34 197 94 / 35%);
        content: "";
        animation: startup-progress 1.6s ease-in-out infinite;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splash-arrive {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes startup-progress {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-splash,
        .startup-mark::before,
        .startup-mark::after,
        .startup-progress::after {
          animation-duration: 0.01ms;
          animation-iteration-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell">
        <main class="startup-splash" role="status" aria-live="polite">
          <div class="startup-mark" aria-hidden="true"><span>CH</span></div>
          <div class="startup-copy">
            <strong>Preparando seu ambiente</strong>
            <span>Estamos organizando tudo para você.</span>
          </div>
          <div class="startup-progress" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script type="module">
      const loadVlibras = () => {
        const vlibrasScript = document.createElement("script");
        vlibrasScript.src = "https://vlibras.gov.br/app/vlibras-plugin.js";
        vlibrasScript.onload = () => {
          new window.VLibras.Widget("https://vlibras.gov.br/app");
        };
        document.head.append(vlibrasScript);
      };

      if (typeof window.requestIdleCallback === "function") {
        window.requestIdleCallback(loadVlibras, { timeout: 5000 });
      } else {
        window.setTimeout(loadVlibras, 3000);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
